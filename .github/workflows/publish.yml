name: Publish to npm

on:
    push:
        tags:
            - 'v*.*.*'

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Check the tag
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "::error::Tag $GITHUB_REF_NAME is not on main"
                      exit 1
                  fi
                  echo "VERSION=$version" >> "$GITHUB_ENV"

            - name: Read release notes from CHANGELOG.md
              run: |
                  awk -v heading="## [$VERSION]" '
                      index($0, heading) == 1 { found = 1; next }
                      found && /^## \[/ { exit }
                      found { print }
                  ' CHANGELOG.md > release-notes.md
                  if ! grep -q '[^[:space:]]' release-notes.md; then
                      echo "::error::CHANGELOG.md has no entry for [$VERSION]"
                      exit 1
                  fi

            - uses: pnpm/action-setup@v6
              with:
                  version: 10

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - run: pnpm install --frozen-lockfile

            - name: Build package
              run: pnpm build

            - name: Publish to npm
              run: |
                  if [[ "$VERSION" == *-* ]]; then
                      npm publish --access public --provenance --tag next
                  else
                      npm publish --access public --provenance
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub release
              run: |
                  flags=()
                  if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
                  gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag "${flags[@]}"
              env:
                  GH_TOKEN: ${{ github.token }}
