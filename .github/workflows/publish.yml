name: Publish to npm

on:
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to rehearse; defaults to the version in package.json
                required: false

concurrency:
    group: publish
    cancel-in-progress: false

env:
    REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Check the tag
              env:
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  tag="$GITHUB_REF_NAME"
                  if [ "$REHEARSAL" = true ]; then tag="${INPUT_TAG:-v$version}"; fi
                  echo "Refs available after checkout:"
                  git for-each-ref --format='  %(refname)' refs/remotes refs/tags | head -20
                  if [ "v$version" != "$tag" ]; then
                      echo "::error::Tag $tag does not match package.json version $version"
                      exit 1
                  fi
                  if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "Commit $GITHUB_SHA is on main"
                  elif [ "$REHEARSAL" = true ]; then
                      echo "::warning::Rehearsing from a commit that is not on main; a real tag here would stop"
                  else
                      echo "::error::Tag $tag is not on main"
                      exit 1
                  fi
                  echo "VERSION=$version" >> "$GITHUB_ENV"
                  echo "TAG=$tag" >> "$GITHUB_ENV"

            - name: Read release notes from CHANGELOG.md
              run: |
                  awk -v heading="## [$VERSION]" '
                      index($0, heading) == 1 { found = 1; next }
                      found && /^## \[/ { exit }
                      found { print }
                  ' CHANGELOG.md > release-notes.md
                  if ! grep -q '[^[:space:]]' release-notes.md; then
                      if [ "$REHEARSAL" = true ]; then
                          echo "::warning::CHANGELOG.md has no entry for [$VERSION] yet"
                      else
                          echo "::error::CHANGELOG.md has no entry for [$VERSION]"
                          exit 1
                      fi
                  fi
                  echo "Release notes:"
                  sed 's/^/  /' release-notes.md

            - uses: pnpm/action-setup@v6
              with:
                  version: 10

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - run: pnpm install --frozen-lockfile

            - name: Build package
              run: pnpm build

            - name: Check what the token may do
              if: env.REHEARSAL == 'true'
              run: |
                  echo "Token identity:"
                  npm whoami || echo "::warning::npm does not recognise this token"
                  echo "Packages it may write:"
                  npm access list packages || echo "::warning::the token cannot list packages"
                  echo "Permission on this package:"
                  npm access get status @sv5ui/scheduler 2>&1 || true
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish to npm
              run: |
                  flags=(--access public)
                  if [[ "$VERSION" == *-* ]]; then flags+=(--tag next); fi
                  if [ "$REHEARSAL" = true ]; then
                      npm publish --dry-run "${flags[@]}"
                  else
                      npm publish --provenance "${flags[@]}"
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub release
              if: env.REHEARSAL != 'true'
              run: |
                  flags=()
                  if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
                  gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag "${flags[@]}"
              env:
                  GH_TOKEN: ${{ github.token }}
